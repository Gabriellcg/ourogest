services:
  mariadb:
    image: mariadb:10.11
    container_name: ourogest_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_segura
      MARIADB_DATABASE: ourogest
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb_data: